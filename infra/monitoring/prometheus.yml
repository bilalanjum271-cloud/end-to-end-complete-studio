global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: ledger
    static_configs: [{ targets: ["host.docker.internal:8102"] }]
  - job_name: cell-router
    static_configs: [{ targets: ["host.docker.internal:8103"] }]
