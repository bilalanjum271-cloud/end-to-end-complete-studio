[project]
name = "xen-studio-pipeline"
version = "0.1.0"
description = "Xen Studio AI services: model router, Script-to-Video pipeline, project API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "temporalio>=1.9",
  "pydantic>=2.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["xen_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E702", "E501"]  # FastAPI Depends()/Header() defaults; compact test lines
